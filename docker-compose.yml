

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hotel
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: laravel-api
    ports:
      - "8000:8000"
    volumes:
      - ./API:/var/www
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hotel
      DB_USERNAME: user
      DB_PASSWORD: secret

  front:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
    container_name: nuxt-front
    ports:
      - "3000:3000"
    volumes:
      - ./FRONT:/app
    depends_on:
      - api

volumes:
  db-data:
